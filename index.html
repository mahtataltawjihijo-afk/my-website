@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
:root{
  --cyan:#39d7e8;
  --cyan-dark:#079bb2;
  --purple:#8655e8;
  --purple-light:#f0eaff;
  --black:#111522;
  --dark-card:#191e2d;
  --text:#202638;
  --muted:#747c91;
  --background:#f6f8fc;
  --white:#ffffff;
  --border:#e4e8f1;
  --green:#16875b;
  --red:#bd3546;
  --radius:20px;
  --shadow:0 12px 32px rgba(24,34,65,0.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--background);color:var(--text);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.8}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.app-shell{min-height:100vh;background:var(--background);padding-top:var(--safe-area-inset-top,0);box-sizing:border-box;overflow-x:clip}
.hero{
  position:relative;isolation:isolate;overflow:hidden;
  padding:82px 22px 90px;
  background:
    radial-gradient(circle at 18% 18%, #8655e866, transparent 34%),
    radial-gradient(circle at 84% 72%, #39d7e855, transparent 30%),
    radial-gradient(circle at 50% 120%, #8655e822, transparent 50%),
    var(--black);
  color:var(--white);text-align:center;
}
.hero-inner{position:relative;z-index:1;max-width:860px;margin:auto}
.brand-mark{
  display:grid;place-items:center;width:78px;height:78px;margin:0 auto 16px;
  border:1px solid #ffffff2f;border-radius:22px;background:#ffffff12;font-size:38px;backdrop-filter:blur(6px)
}
.eyebrow{margin:0;color:var(--cyan);font-size:14px;font-weight:800;letter-spacing:0.5px}
.hero h1{margin:10px 0;font-size:clamp(30px,6vw,56px);font-weight:900;line-height:1.25}
.hero-description{margin:14px auto 30px;color:#d5d9e8;font-size:17px;max-width:560px}
.primary-button{
  display:inline-flex;justify-content:center;align-items:center;min-height:50px;
  padding:12px 28px;border:0;border-radius:14px;background:var(--cyan);color:#07151b;font-weight:800;transition:0.22s ease;box-shadow:0 10px 24px #39d7e840
}
.primary-button:hover{background:#78eaf3;transform:translateY(-2px)}
.hero-glow{position:absolute;z-index:0;top:22%;left:12%;width:260px;height:260px;border-radius:50%;background:#8655e830;filter:blur(55px);pointer-events:none}
.hero-glow2{position:absolute;z-index:0;bottom:8%;right:14%;width:240px;height:240px;border-radius:50%;background:#39d7e822;filter:blur(50px);pointer-events:none}
.top-nav{
  position:sticky;top:var(--safe-area-inset-top,0);z-index:20;
  display:flex;justify-content:center;gap:34px;padding:14px 16px;
  border-bottom:1px solid var(--border);background:#ffffffed;backdrop-filter:blur(14px)
}
.top-nav a{font-size:14px;font-weight:700;position:relative;padding-bottom:2px}
.top-nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--purple);transform:scaleX(0);transition:0.2s}
.top-nav a:hover::after{transform:scaleX(1)}
.section{width:min(1120px,calc(100% - 36px));margin:0 auto;padding:56px 0}
.section-heading{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.section-icon{display:grid;flex-shrink:0;place-items:center;width:56px;height:56px;border-radius:17px;background:var(--purple-light);font-size:26px}
.section-heading h2{margin:0;font-size:clamp(21px,3vw,30px);font-weight:900}
.section-heading p{margin:4px 0 0;color:var(--muted);font-size:14px}
.news-grid,.generation-grid,.track-grid,.subject-grid,.channels-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.news-card,.generation-card,.track-card,.subject-card,.channel-card,.empty-state{border:1px solid var(--border);border-radius:var(--radius);background:var(--white);box-shadow:var(--shadow)}
.news-card{padding:22px;transition:0.2s}
.news-card:hover{transform:translateY(-2px)}
.news-card time{color:var(--purple);font-size:12px;font-weight:800}
.news-card h3{margin:8px 0;font-size:18px;line-height:1.5}
.news-card p{margin:0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.9}
.empty-state{padding:36px 18px;text-align:center;grid-column:1/-1}
.empty-state span{font-size:34px}
.empty-state p{margin:10px 0 0;color:var(--muted)}
.notice,.error-notice{padding:12px 16px;border-radius:12px;background:#e8f9fc;color:#126f7b}
.generation-section{padding-top:30px}
.generation-card,.track-card{display:flex;flex-direction:column;align-items:flex-start;min-height:228px;padding:26px;border:2px solid transparent;text-align:right;transition:0.22s ease;position:relative;overflow:hidden}
.generation-card::before,.track-card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%, #8655e811, transparent 60%);opacity:0;transition:0.2s}
.generation-card:hover,.track-card:hover,.subject-card:hover,.channel-card:hover{transform:translateY(-4px);box-shadow:0 18px 38px #18224114}
.generation-card:hover::before,.track-card:hover::before{opacity:1}
.generation-card.selected,.track-card.selected{border-color:var(--purple);background:#f8f4ff}
.card-emoji{margin-bottom:14px;font-size:36px}
.generation-year{color:var(--purple);font-size:36px;font-weight:900;line-height:1}
.generation-card span:not(.card-emoji):not(.generation-year){font-weight:800;margin-top:4px}
.card-hint{margin-top:auto;padding-top:16px;color:var(--muted);font-size:13px}
.track-card{min-height:170px;gap:8px}
.track-card span{font-size:30px}
.track-card strong{font-size:16px;line-height:1.5}
.track-card small{color:var(--purple);font-weight:700}
.subject-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.subject-card{display:flex;flex-direction:column;align-items:flex-start;padding:22px;transition:0.22s;position:relative}
.subject-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#e8faff;font-size:22px;flex-shrink:0}
.subject-card h3{margin:16px 0 14px;font-size:16px;line-height:1.6;min-height:48px}
.subject-button{display:inline-flex;justify-content:center;width:100%;margin-top:auto;padding:11px 12px;border-radius:12px;background:var(--black);color:white;text-align:center;font-size:13px;font-weight:800;transition:0.18s}
.subject-button:hover{background:var(--purple)}
.coming-soon{width:100%;margin-top:auto;padding:11px 8px;border-radius:11px;background:#f2f3f7;color:var(--muted);text-align:center;font-size:12px;font-weight:700}
.channels-section{padding-bottom:80px}
.channels-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.channel-card{display:flex;align-items:center;gap:12px;min-height:92px;padding:18px;transition:0.22s}
.channel-card span:first-child{display:grid;flex-shrink:0;place-items:center;width:44px;height:44px;border-radius:13px;background:#e6fbf2;font-size:22px}
.channel-card strong{flex:1;font-size:13px;line-height:1.7}
.external-arrow{color:var(--purple);font-size:18px;font-weight:800}
.footer{display:flex;flex-direction:column;align-items:center;padding:44px 20px 28px;background:var(--black);color:white;text-align:center;gap:6px}
.footer-logo{color:var(--cyan);font-size:20px;font-weight:900}
.footer p{color:#b7bfd3;margin:6px 0}
.footer-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.footer a{color:#dbe0ef;font-size:14px}
.footer a:hover{color:var(--cyan)}
.footer small{margin-top:18px;color:#9ca5bb}
.admin-link{margin-top:14px !important;font-size:12px;opacity:0.75;border:1px solid #ffffff22;padding:8px 14px;border-radius:10px}
.admin-page{min-height:100vh;padding:36px 18px;background:radial-gradient(circle at 85% 5%, #8655e81b, transparent 28%),var(--background)}
.admin-container{width:min(1080px,100%);margin:0 auto}
.admin-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.admin-header h1,.login-card h1{margin:8px 0;font-size:clamp(25px,4vw,36px);font-weight:900}
.admin-header p,.login-card p{color:var(--muted)}
.back-link{color:var(--purple);font-size:14px;font-weight:800}
.admin-panel,.login-card{margin-bottom:22px;padding:26px;border:1px solid var(--border);border-radius:var(--radius);background:white;box-shadow:var(--shadow)}
.admin-panel h2{margin-top:0;font-size:20px;font-weight:900}
.admin-form{display:flex;flex-direction:column;gap:10px}
.admin-form label,.admin-panel label{margin-top:6px;font-weight:800;font-size:14px}
.admin-form input,.admin-form textarea,.admin-panel select,.admin-subject-item input{width:100%;min-width:0;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:#fbfcff;color:var(--text);transition:0.15s}
.admin-form input:focus,.admin-form textarea:focus,.admin-panel select:focus,.admin-subject-item input:focus{border-color:var(--purple);background:white}
.admin-form textarea{resize:vertical}
.secondary-button,.danger-button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 16px;border:1px solid var(--border);border-radius:11px;background:white;color:var(--text);font-weight:800;transition:0.18s}
.secondary-button:hover{border-color:var(--purple);color:var(--purple)}
.secondary-button:disabled{cursor:wait;opacity:0.6}
.danger-button{flex-shrink:0;border-color:#f3d4d8;background:#fff3f4;color:var(--red)}
.admin-message{padding:12px 15px;border-radius:11px;background:#e8f9fc;color:#126f7b;overflow-wrap:anywhere;margin-top:14px;font-weight:700;font-size:13px}
.security-note{margin-top:22px;padding:12px;border-radius:10px;background:#f6f7fb;color:var(--muted);font-size:12px;line-height:1.8}
.login-card{width:min(500px,100%);margin:6vh auto;padding:32px}
.login-card .brand-mark{margin-top:20px;background:var(--purple-light);color:var(--black)}
.admin-news-list,.admin-subject-list{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.admin-news-item,.admin-subject-item{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:14px;background:#fcfcff}
.admin-news-item>div{flex:1;min-width:0}
.admin-news-item p{margin:6px 0 0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.admin-subject-item{align-items:stretch;flex-wrap:wrap}
.admin-subject-heading{display:flex;flex-direction:column;min-width:200px;gap:2px}
.admin-subject-heading strong{font-size:14px}
.admin-subject-heading span{color:var(--muted);font-size:11px;line-height:1.6}
.admin-subject-item input{flex:1;min-width:230px;direction:ltr;text-align:left;font-size:13px}
.badge-new{background:var(--cyan);color:#08343b;font-size:10px;font-weight:900;padding:3px 8px;border-radius:20px;margin-right:8px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--purple-light);color:var(--purple);font-size:12px;font-weight:800}
.visit-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 20px}
.visit-card{padding:16px;border-radius:14px;background:linear-gradient(135deg,#f8f4ff,#eefaff);border:1px solid var(--border);text-align:center}
.visit-card strong{display:block;font-size:28px;font-weight:900;color:var(--black);line-height:1}
.visit-card span{font-size:12px;color:var(--muted);font-weight:700}
.visit-bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding:12px 8px 0;border-top:1px dashed var(--border);margin-top:12px}
.visit-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.visit-bar-track{width:100%;background:#eef1f8;border-radius:8px 8px 3px 3px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.visit-bar-fill{width:100%;background:linear-gradient(180deg,var(--purple),var(--cyan));border-radius:8px 8px 3px 3px;transition:0.3s;min-height:4px}
.visit-bar small{font-size:10px;color:var(--muted);font-weight:800;text-align:center;line-height:1.2}
.visit-bar b{font-size:12px;color:var(--black)}
.visit-list{margin-top:14px;max-height:280px;overflow:auto;border:1px solid var(--border);border-radius:12px;background:#fbfcff}
.visit-list-item{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid #eef1f8;font-size:12px}
.visit-list-item:last-child{border-bottom:0}
.visit-list-item span:first-child{direction:ltr;text-align:left;font-family:monospace}
@media (max-width:860px){
  .subject-grid,.channels-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .section{padding:42px 0}
  .visit-stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:580px){
  .hero{padding:58px 18px 68px}
  .hero-description{font-size:14px}
  .top-nav{gap:18px;font-size:12px;padding:12px}
  .section{width:calc(100% - 28px);padding:36px 0}
  .news-grid,.generation-grid,.track-grid,.subject-grid,.channels-grid{grid-template-columns:1fr}
  .generation-card{min-height:200px}
  .track-card{min-height:138px}
  .channel-card{min-height:80px}
  .admin-page{padding:20px 12px}
  .admin-panel,.login-card{padding:18px}
  .admin-header{align-items:flex-start;flex-direction:column}
  .admin-news-item{align-items:flex-start;flex-direction:column}
  .admin-subject-item{flex-direction:column}
  .admin-subject-item input{min-width:0}
}
